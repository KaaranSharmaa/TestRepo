<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You ❤️</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ===================== WELCOME SCREEN ===================== -->
  <section id="welcome-screen">
    <div class="password-card">
      <div class="heart-icon">👀</div>
      <h1>Ohhhh hello, look who is here! Ahem ahem! 😏</h1>
      <div class="user-buttons">
        <button class="primary-btn user-btn" onclick="selectUser('Karan')">Karan</button>
        <button class="primary-btn user-btn" onclick="selectUser('Anusha')">Anusha</button>
      </div>
    </div>
  </section>

  <!-- ===================== PASSWORD SCREEN ===================== -->
  <section id="password-screen" class="hidden">
    <div class="password-card">
      <div class="heart-icon">❤️</div>
      <h1>Welcome Back ❤️</h1>
      <p class="subtitle">Some memories are meant to be revisited.</p>
      <div class="input-group">
        <input type="password" id="password-input" placeholder="Enter password..." autocomplete="off" />
        <button id="enter-btn" onclick="checkPassword()">Enter</button>
      </div>
      <p id="personalized-greeting" class="personalized-greeting"></p>
      <p id="error-msg" class="error-msg">Hmm, that's not right. Try again 🌸</p>
    </div>
  </section>

  <!-- ===================== LANDING PAGE ===================== -->
  <section id="landing-page" class="hidden">
    <div class="landing-content">
      <h1 class="landing-heading">Hey, You ❤️</h1>
      <p class="landing-subtitle">Hello Biwi Ch..uff Look at that eye .</p>

      <!-- HERO IMAGE: Replace "images/hero.jpg" with your chosen hero photo -->
      <div class="hero-image-wrapper">
        <img src="images/1.jpeg" alt="Our photo" class="hero-image" onerror="this.style.display='none'; this.parentElement.classList.add('no-image')" />
        <div class="hero-placeholder">📷</div>
      </div>

      <button class="primary-btn" onclick="openGallery()">Welcome to K&A World →</button>
    </div>
  </section>

  <!-- ===================== PHOTO GALLERY ===================== -->
  <section id="gallery-page" class="hidden">
    <div class="gallery-container">
      <button class="back-btn" onclick="goBack()">← Back</button>
      <h2 class="gallery-title">Our Memories</h2>

      <div class="slideshow">
        <p id="slide-caption" class="slide-caption"></p>
        <div class="slide-wrapper">
          <img id="slide-img" src="" alt="Memory" />
        </div>
        <p id="slide-counter" class="slide-counter">1 / 1</p>
        <div class="slide-controls">
          <button class="nav-btn" onclick="prevPhoto()">← Prev</button>
          <button class="nav-btn" onclick="nextPhoto()">Next →</button>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
